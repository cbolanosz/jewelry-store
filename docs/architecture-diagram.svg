<text x="549.0" y="831.0" font-size="15" text-anchor="start" dominant-baseline="central" fill="black">layouts/admin.blade.php</text>
<text x="549.0" y="853.0" font-size="15" text-anchor="start" dominant-baseline="central" fill="black">admin/home/ · admin/product/ · admin/category/</text>
<text x="720.0" y="902.0" font-size="15" text-anchor="middle" dominant-baseline="central" fill="black">Texts: resources/lang/en · resources/lang/es</text>
<text x="1160.0" y="658.0" font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="black">MODEL  (app/Models - Eloquent)</text>
