<text x="952.0" y="244.0" font-size="14" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="black">2. Route -&gt; Controller@method</text>
<text x="952.0" y="351.0" font-size="14" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="black">3. Access check</text>
<text x="1172.0" y="604.0" font-size="14" font-weight="bold" text-anchor="start" dominant-baseline="central" fill="black">4. Eloquent (read / write)</text>
