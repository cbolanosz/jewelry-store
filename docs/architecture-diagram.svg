<text x="1160.0" y="867.0" font-size="15" text-anchor="middle" dominant-baseline="central" fill="black">Private attributes with getters / setters</text>
<text x="1160.0" y="891.0" font-size="15" text-anchor="middle" dominant-baseline="central" fill="black">Relationships · domain methods</text>
<text x="1665.0" y="756.0" font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="black">MySQL</text>
<text x="1665.0" y="786.0" font-size="15" text-anchor="middle" dominant-baseline="central" fill="black">categories · products · users</text>
<text x="1665.0" y="810.0" font-size="15" text-anchor="middle" dominant-baseline="central" fill="black">orders · order_items · payments</text>
