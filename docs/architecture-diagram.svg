<text x="915.0" y="55.0" font-size="26" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="black">God's programmers - Jewelry Store MVC Architecture</text>
<text x="180.0" y="134.0" font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="black">CLIENT</text>
<text x="180.0" y="179.0" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="black">End user</text>
<text x="74.0" y="205.0" font-size="15" text-anchor="start" dominant-baseline="central" fill="black">Web browser</text>
<text x="74.0" y="227.0" font-size="15" text-anchor="start" dominant-baseline="central" fill="black">Routes /*</text>
<text x="74.0" y="249.0" font-size="15" text-anchor="start" dominant-baseline="central" fill="black">Browse, search, buy</text>
<text x="180.0" y="319.0" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="black">Administrator</text>
<text x="74.0" y="345.0" font-size="15" text-anchor="start" dominant-baseline="central" fill="black">Web browser</text>
<text x="74.0" y="367.0" font-size="15" text-anchor="start" dominant-baseline="central" fill="black">Routes /admin/* (role admin)</text>
<text x="74.0" y="389.0" font-size="15" text-anchor="start" dominant-baseline="central" fill="black">CRUD products, categories</text>
<text x="940.0" y="134.0" font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="black">SERVER - Laravel 13 (PHP)</text>
<text x="940.0" y="179.0" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="black">Routes (routes/web.php)</text>
<text x="940.0" y="205.0" font-size="15" text-anchor="middle" dominant-baseline="central" fill="black">Maps each URL to Controller@method: end user (/*) and administrator (/admin/*)</text>
<text x="940.0" y="281.0" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="black">Middleware</text>
<text x="940.0" y="307.0" font-size="15" text-anchor="middle" dominant-baseline="central" fill="black">auth (logged-in user)  ·  admin (AdminAuthMiddleware: role = admin)</text>
<text x="940.0" y="398.0" font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="black">CONTROLLER  (app/Http/Controllers)</text>
<text x="670.0" y="443.0" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="black">End-user controllers</text>
<text x="554.0" y="469.0" font-size="15" text-anchor="start" dominant-baseline="central" fill="black">HomeController</text>
<text x="554.0" y="491.0" font-size="15" text-anchor="start" dominant-baseline="central" fill="black">ProductController</text>
<text x="554.0" y="513.0" font-size="15" text-anchor="start" dominant-baseline="central" fill="black">CartController</text>
<text x="554.0" y="535.0" font-size="15" text-anchor="start" dominant-baseline="central" fill="black">OrderController</text>
<text x="950.0" y="443.0" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="black">Admin controllers (Admin\)</text>
<text x="834.0" y="469.0" font-size="15" text-anchor="start" dominant-baseline="central" fill="black">AdminHomeController</text>
<text x="834.0" y="491.0" font-size="15" text-anchor="start" dominant-baseline="central" fill="black">AdminProductController</text>
<text x="834.0" y="513.0" font-size="15" text-anchor="start" dominant-baseline="central" fill="black">AdminCategoryController</text>
<text x="1220.0" y="443.0" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="black">Support</text>
<text x="1114.0" y="469.0" font-size="15" text-anchor="start" dominant-baseline="central" fill="black">Auth\LoginController</text>
<text x="1114.0" y="491.0" font-size="15" text-anchor="start" dominant-baseline="central" fill="black">Auth\RegisterController</text>
<text x="1114.0" y="513.0" font-size="15" text-anchor="start" dominant-baseline="central" fill="black">Form Requests (validation)</text>
<text x="720.0" y="658.0" font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="black">VIEW  (resources/views - Blade)</text>
<text x="720.0" y="703.0" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="black">End-user views (extend layouts.app)</text>
