<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Options -Indexes
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/jewelry-store-error.log
    CustomLog ${APACHE_LOG_DIR}/jewelry-store-access.log combined
</VirtualHost>
